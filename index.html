<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budges - Multi-Ledger Budgeting</title>
  <style>
    :root {
      --bg-color: #121824;
      --card-bg: #1c2436;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #2e3a52;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Ledger Switcher Bar */
    .ledger-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      align-items: center;
    }

    select, input, button {
      background: #0f1523;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .ledger-select {
      flex: 1;
      cursor: pointer;
    }

    button {
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Balance Card */
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .balance-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .balance-val {
      font-size: 1.75rem;
      font-weight: 700;
      margin-top: 4px;
    }

    /* Form */
    .entry-form {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row input {
      flex: 1;
    }

    /* Transactions List */
    .transactions {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .transaction-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .transaction-row:last-child {
      border-bottom: none;
    }

    .tx-desc {
      font-size: 0.95rem;
      font-weight: 500;
    }
